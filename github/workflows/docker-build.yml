name: Docker Build and Test

on:
  push:
    paths:
      - 'aws-infrastructure/docker-app/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t dillon-flask-app:test \
            aws-infrastructure/docker-app/

      - name: Run container
        run: |
          docker run -d \
            -p 5000:5000 \
            --name flask-test \
            dillon-flask-app:test

      - name: Wait for app to start
        run: sleep 5

      - name: Test health endpoint
        run: |
          curl -f http://localhost:5000/health

      - name: Stop container
        run: docker stop flask-test